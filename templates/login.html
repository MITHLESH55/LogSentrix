<!DOCTYPE html>
<html>
<head>
    <title>LogSentrix AI - Security Dashboard Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-pQ5m1M6QDEbZuqWAe4iHkS0U4Rhq7uYG7TNjVYcgzVeowLXqbHTYqo7PRo1GZ5V3CWFSmrUHUZJdro0aNw3r0Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: #030804;
            background-image: 
                radial-gradient(circle at center, rgba(16, 185, 129, 0.08) 0%, transparent 100%),
                linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4ade80;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(4, 20, 10, 0.85);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1), inset 0 0 20px rgba(16, 185, 129, 0.05);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            color: #10b981;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .login-header p {
            color: #059669;
            font-size: 14px;
        }

        .login-icon {
            width: 40px;
            height: 40px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #4ade80;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 4px;
            background: #030804;
            color: #4ade80;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        .form-group input::placeholder {
            color: #059669;
        }

        .form-checkbox {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .form-checkbox input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
            cursor: pointer;
        }

        .form-checkbox label {
            margin: 0;
            color: #4ade80;
            font-size: 13px;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 12px 16px;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.5);
            border-radius: 4px;
            font-size: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .login-btn:hover {
            background: #10b981;
            color: #000;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .error-message i {
            flex-shrink: 0;
        }

        .info-message {
            background: #dbeafe;
            border: 1px solid #93c5fd;
            color: #1e40af;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .info-message i {
            flex-shrink: 0;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: #059669;
            font-size: 12px;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>
                    <div class="login-icon">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    LogSentrix AI
                </h1>
                <p>Security Operations Center</p>
            </div>

            {% if error %}
            <div class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="post" id="loginForm">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user" style="margin-right: 6px;"></i>Username
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username"
                        required
                        autocomplete="username"
                        autofocus
                    />
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock" style="margin-right: 6px;"></i>Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    />
                </div>

                <div class="form-checkbox">
                    <input 
                        type="checkbox" 
                        id="remember_me" 
                        name="remember_me"
                    />
                    <label for="remember_me">Remember me for 7 days</label>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </button>
            </form>

            <div class="login-footer">
                <p>Secure authentication powered by Flask-Login</p>
                <p style="margin-top: 12px; color: #94a3b8; font-size: 13px;">
                    Don't have an account? <a href="{{ url_for('register') }}" style="color: #3b82f6; text-decoration: none; font-weight: 500; cursor: pointer;">Sign up here</a>
                </p>
                <p style="margin-top: 8px; color: #475569;">© 2026 LogSentrix AI - All rights reserved</p>
            </div>
        </div>
    </div>

    <script>
        // Prevent double submission
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', function(e) {
            const submitBtn = loginForm.querySelector('.login-btn');
            submitBtn.classList.add('loading');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
        });

        // Focus management
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('password').focus();
                e.preventDefault();
            }
        });

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loginForm.submit();
            }
        });
    </script>
</body>
</html>
